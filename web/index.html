<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- One per mode, so the browser chrome matches the page it frames. -->
    <meta name="theme-color" content="#fff8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1110" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="HyperCraft —— 自托管的 Minecraft 服务器面板" />
    <!-- The same cube as components/Logo.tsx and docs/images/logo.svg. Inline so
         it travels inside the single binary with everything else, and with the
         percent-encoding a data URI needs for < > and #. A tab strip has no
         theme to follow, so this one keeps the light gradient in both modes
         rather than the themed --brand-face the in-app tiles use. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3ClinearGradient id='f' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23c97b62'/%3E%3Cstop offset='1' stop-color='%237d402e'/%3E%3C/linearGradient%3E%3Crect width='64' height='64' rx='16' fill='url(%23f)'/%3E%3Cg fill='%23fff'%3E%3Cpolygon points='32,13 46,21 32,29 18,21' opacity='.96'/%3E%3Cpolygon points='18,21 32,29 32,45 18,37' opacity='.72'/%3E%3Cpolygon points='46,21 32,29 32,45 46,37' opacity='.52'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>HyperCraft 面板</title>
    <!-- Mode is resolved before the first paint rather than in React, so a
         reload never flashes the wrong one. The key and the three values match
         theme.ts; "跟随系统" is stored as no key at all. -->
    <script>
      ;(function () {
        var pref = null
        try {
          pref = localStorage.getItem('hypercraft.theme')
        } catch (e) {
          /* storage disabled; follow the system */
        }
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.background = dark ? '#1a1110' : '#fff8f6'

        // The pixel face, resolved here for the same reason: it changes the
        // metrics of every line on the page, so deciding it after the bundle
        // loads means watching the whole panel re-typeset itself. On is the
        // default and is stored as no key at all; the key and that rule match
        // pixelfont.ts.
        var pixel = true
        try {
          pixel = localStorage.getItem('hypercraft.pixelfont') !== 'off'
        } catch (e) {
          /* storage disabled; the default stands */
        }
        if (pixel) document.documentElement.dataset.pixelFont = 'on'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
