<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser chrome, painted the colour of the page it frames. One tag
         rather than one per mode: the page colour is a mode *and* a 配色 now,
         and a media query only knows about the first half. The script below
         sets it before first paint and theme.ts keeps it in step after. -->
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="description" content="HyperCraft —— 自托管的 Minecraft 服务器面板" />
    <!-- The same cube as components/Logo.tsx and docs/images/logo.svg. Inline so
         it travels inside the single binary with everything else, and with the
         percent-encoding a data URI needs for < > and #. A tab strip has no
         theme to follow, so this one keeps the light gradient in both modes
         rather than the themed --brand-face the in-app tiles use.

         The two stops are the default scheme's; under any other 配色 they are
         substituted at boot and on every switch from --mark-1 / --mark-2 (see
         syncFavicon in theme.ts), which is why this markup is the only copy of
         the artwork and not one of two. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3ClinearGradient id='f' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2335c48d'/%3E%3Cstop offset='1' stop-color='%230a5f41'/%3E%3C/linearGradient%3E%3Crect width='64' height='64' rx='16' fill='url(%23f)'/%3E%3Cg fill='%23fff'%3E%3Cpolygon points='32,13 46,21 32,29 18,21' opacity='.96'/%3E%3Cpolygon points='18,21 32,29 32,45 18,37' opacity='.72'/%3E%3Cpolygon points='46,21 32,29 32,45 46,37' opacity='.52'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>HyperCraft 面板</title>
    <!-- Mode is resolved before the first paint rather than in React, so a
         reload never flashes the wrong one. The key and the three values match
         theme.ts; "跟随系统" is stored as no key at all. -->
    <script>
      ;(function () {
        var pref = null
        try {
          pref = localStorage.getItem('hypercraft.theme')
        } catch (e) {
          /* storage disabled; follow the system */
        }
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'

        // The 配色, resolved here for the same reason and stored the same way:
        // the default is no key at all, anything unrecognised falls back to it,
        // and the keys match palette.ts.
        //
        // The page colour of each scheme is duplicated here as the one thing
        // that has to be known before the stylesheet exists — it paints the
        // document behind the app and the browser's own chrome, and both are
        // visible in the frame before the CSS arrives. Ten values, kept in
        // step with the token blocks in styles.css by hand.
        var page = {
          stone: ['#f5f6f8', '#121417'],
          sakura: ['#fff8f6', '#1a1110'],
          green: ['#f9faef', '#12140e'],
          yellow: ['#fff9ee', '#15130b'],
          blue: ['#f9f9ff', '#111318'],
        }
        var palette = null
        try {
          palette = localStorage.getItem('hypercraft.palette')
        } catch (e) {
          /* storage disabled; the default stands */
        }
        // hasOwnProperty rather than a truthiness test: a hand-edited key of
        // "constructor" is a real value on every object literal, and it would
        // get written onto <html> as a scheme no stylesheet answers to.
        if (!Object.prototype.hasOwnProperty.call(page, palette)) palette = 'stone'
        if (palette !== 'stone') document.documentElement.dataset.palette = palette

        var bg = page[palette][dark ? 1 : 0]
        document.documentElement.style.background = bg
        var chrome = document.querySelector('meta[name="theme-color"]')
        if (chrome) chrome.content = bg

        // The pixel face, resolved here for the same reason: it changes the
        // metrics of every line on the page, so deciding it after the bundle
        // loads means watching the whole panel re-typeset itself. Off is the
        // default and is stored as no key at all; the key and that rule match
        // pixelfont.ts.
        var pixel = false
        try {
          pixel = localStorage.getItem('hypercraft.pixelfont') === 'on'
        } catch (e) {
          /* storage disabled; the default stands */
        }
        if (pixel) document.documentElement.dataset.pixelFont = 'on'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
