name: Snapshot

# Publishes a build of main as a prerelease, so people who want to try what is
# coming can get it from the panel's update page instead of building it.
#
# It hangs off CI rather than off the push, so only a commit that already went
# green is ever published. A snapshot is never a release: it is tagged
# snapshot-<提交数>, marked prerelease on GitHub, and only offered to panels
# that have switched their update channel to 快照.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Needed to create the snapshot tag, the prerelease, and to prune old ones.
permissions:
  contents: write

# Snapshots queue instead of cancelling: a run killed halfway through the
# upload would leave a prerelease with missing or partial archives.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: 构建并发布快照
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      # workflow_run starts from the default branch, not from the commit CI
      # ran on, so the sha is checked out explicitly. The full history is
      # needed for the commit count below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # A snapshot is not heading for a particular release, so it is not named
      # after one: it is whatever main was at this commit, and the commit count
      # is the only number it has. That count is also why the version is not a
      # semantic one — see selfupdate.CompareVersions, which sorts snapshots
      # among themselves by this number and above every release.
      #
      # The count rather than the run number: it stays meaningful if this
      # workflow is renamed, and re-running the same commit reproduces the same
      # version instead of inventing a newer one.
      #
      # This naming was tried once before and had to be reverted: the panel
      # doing the comparison is the one already installed on the machine, and a
      # build without a parser for it skips such a tag as uncomparable, finds
      # nothing newer it can read, and reports "already up to date" forever. So
      # the parser shipped first, under the old naming, and only once panels
      # were running it did the workflow start producing this. Any future change
      # to what a version looks like has to go in that order.
      #
      # Unlike the naming this replaces, there is nothing to skip here. The
      # release commit gets a snapshot of its own, so a panel on the snapshot
      # channel ends up with the released code rather than sitting one commit
      # behind it until main moves again.
      - id: v
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          tag="snapshot-$(git rev-list --count HEAD)"
          echo "准备发布快照 $tag ($(git rev-parse --short "$SHA"))"
          {
            echo "sha=$SHA"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefix web

      # No lint or test here: this workflow only runs for a commit whose CI run
      # already passed, which is the same checks on the same code.
      - name: 交叉编译并打包
        run: make package VERSION=${{ steps.v.outputs.tag }}

      - name: 生成说明
        env:
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -euo pipefail
          {
            printf '这是 main 分支的自动构建，**不是正式发布版本**。\n\n'
            printf '它通过了 CI，但没有经过发布前的人工验证，可能包含未完成的功能。\n'
            printf '生产环境请使用[最新正式版](https://github.com/%s/releases/latest)。\n\n' "$GITHUB_REPOSITORY"
            printf '## 本次构建\n\n'
            printf -- '- 提交：[`%s`](https://github.com/%s/commit/%s)\n' \
              "$(git rev-parse --short "$SHA")" "$GITHUB_REPOSITORY" "$SHA"
            printf -- '- 说明：%s\n\n' "$(git log -1 --pretty=%s "$SHA")"
            printf '## 版本号\n\n'
            printf '快照没有语义化版本号，`snapshot-` 后面是 main 的提交数，数字越大越新。\n'
            printf '快照始终排在所有正式版之前——它就是 main 的最新构建，而正式版是从 main 上切出去的。\n\n'
            printf '## 安装\n\n'
            printf '面板里「设置 → 面板更新 → 更新通道」选择「快照」后即可直接更新到这一版；\n'
            printf '之后切回「正式版」，面板会提示装回最新正式版。\n\n'
            printf '手动安装则下载对应平台的压缩包，解压后运行 `./hypercraft -data ./data`。\n\n'
            printf '## 校验\n\n'
            printf '```bash\nsha256sum -c SHA256SUMS.txt --ignore-missing\n```\n'
          } > notes.md

      - name: 创建快照 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -euo pipefail
          # Re-running for a commit that already has a snapshot replaces its
          # assets rather than failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "快照 $TAG" --notes-file notes.md --prerelease
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "快照 $TAG" --notes-file notes.md --prerelease \
              --target "$SHA"
          fi

      # Every push leaves a prerelease behind, so without this the releases page
      # would be nothing but snapshots within a week. Only the tags this
      # workflow creates are touched — both the current snapshot-N form and the
      # vX.Y-snapshot.N one it replaced, so the old ones still get cleaned up.
      # Real releases never match either pattern.
      #
      # Three is what the update page can actually reach: a panel is only ever
      # offered the newest snapshot, so the older ones are there for a manual
      # download, not for the updater.
      - name: 清理旧快照
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: '3'
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | test("^snapshot-[0-9]+$|-snapshot\\.[0-9]+$")))
                  | sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName' \
            > stale.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "删除旧快照 $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done < stale.txt
