name: Snapshot

# Publishes a build of main as a prerelease, so people who want to try what is
# coming can get it from the panel's update page instead of building it.
#
# It hangs off CI rather than off the push, so only a commit that already went
# green is ever published. A snapshot is never a release: it is tagged
# vX.Y.Z-snapshot.N, marked prerelease on GitHub, and only offered to panels
# that have switched their update channel to 快照.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Needed to create the snapshot tag, the prerelease, and to prune old ones.
permissions:
  contents: write

# Snapshots queue instead of cancelling: a run killed halfway through the
# upload would leave a prerelease with missing or partial archives.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  # Cheap gate: decides whether this commit gets a snapshot and what to call it.
  # An ordinary CI run that does not qualify costs one short job.
  resolve:
    name: 确定快照版本
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      publish: ${{ steps.v.outputs.publish }}
      sha: ${{ steps.v.outputs.sha }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      # workflow_run starts from the default branch, not from the commit CI
      # ran on, so the sha is checked out explicitly. The full history is
      # needed for the build counter below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          released=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$released" ]; then
            echo "::warning::CHANGELOG.md 里没找到 ## [x.y.z] 形式的版本标题，跳过快照"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The version at the top of the changelog is what main claims to be.
          # If its tag is missing, the release workflow is still cutting it —
          # and if HEAD *is* that tag, this commit is the release itself. Either
          # way there is nothing for a snapshot to sit between, so step aside
          # and let the real release be the newest thing on offer.
          if ! git rev-parse -q --verify "refs/tags/v$released" >/dev/null; then
            echo "v$released 还没发布，本次跳过快照"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-list -n1 "v$released")" = "$SHA" ]; then
            echo "这个提交就是 v$released 本身，跳过快照"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A snapshot is work heading towards the next patch release, so it
          # takes that version with a -snapshot suffix: 1.2.0 released means
          # snapshots of 1.2.1. Semver puts it above 1.2.0 and below 1.2.1, so
          # a panel on the stable channel never sees it and a panel on the
          # snapshot channel leaves it as soon as 1.2.1 ships.
          IFS=. read -r major minor patch <<EOF
          ${released%%-*}
          EOF
          next="${major}.${minor}.$((patch + 1))"

          # The build number is the commit count, not the run number: it stays
          # meaningful and keeps increasing even if this workflow is renamed or
          # re-run, and re-running the same commit reproduces the same version
          # rather than inventing a newer one.
          build=$(git rev-list --count HEAD)

          version="${next}-snapshot.${build}"
          echo "准备发布快照 v$version ($(git rev-parse --short "$SHA"))"
          {
            echo "publish=true"
            echo "sha=$SHA"
            echo "tag=v$version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  snapshot:
    name: 构建并发布快照
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefix web

      # No lint or test here: this workflow only runs for a commit whose CI run
      # already passed, which is the same checks on the same code.
      - name: 交叉编译并打包
        run: make package VERSION=${{ needs.resolve.outputs.tag }}

      - name: 生成说明
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf '这是 main 分支的自动构建，**不是正式发布版本**。\n\n'
            printf '它通过了 CI，但没有经过发布前的人工验证，可能包含未完成的功能。\n'
            printf '生产环境请使用[最新正式版](https://github.com/%s/releases/latest)。\n\n' "$GITHUB_REPOSITORY"
            printf '## 本次构建\n\n'
            printf -- '- 提交：[`%s`](https://github.com/%s/commit/%s)\n' \
              "$(git rev-parse --short "$SHA")" "$GITHUB_REPOSITORY" "$SHA"
            printf -- '- 说明：%s\n\n' "$(git log -1 --pretty=%s "$SHA")"
            printf '## 安装\n\n'
            printf '面板里「设置 → 面板更新 → 更新通道」选择「快照」后即可直接更新到这一版；\n'
            printf '之后切回「正式版」就会在下一个正式版发布时回到正式版轨道。\n\n'
            printf '手动安装则下载对应平台的压缩包，解压后运行 `./hypercraft -data ./data`。\n\n'
            printf '## 校验\n\n'
            printf '```bash\nsha256sum -c SHA256SUMS.txt --ignore-missing\n```\n'
          } > notes.md

      - name: 创建快照 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Re-running for a commit that already has a snapshot replaces its
          # assets rather than failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "快照 $TAG" --notes-file notes.md --prerelease
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "快照 $TAG" --notes-file notes.md --prerelease \
              --target "$SHA"
          fi

      # Every push leaves a prerelease behind, so without this the releases page
      # would be nothing but snapshots within a week. Only the tags this
      # workflow creates are touched; real releases never match the pattern.
      - name: 清理旧快照
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: '5'
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | test("-snapshot\\.[0-9]+$")))
                  | sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName' \
            > stale.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "删除旧快照 $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done < stale.txt
