name: Release

# Releases are cut by bumping the version heading in CHANGELOG.md: when a merge
# into main introduces a version that has no tag yet, this workflow tags that
# commit and publishes it. Merges that do not touch the version are skipped in a
# few seconds. Pushing a vX.Y.Z tag by hand still works and takes the same path.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Lets you re-run a release for a tag that already exists, e.g. after fixing
  # the changelog or a failed upload.
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.3.0（必须已经存在）'
        required: true

# Needed to create the tag and the release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap gate: works out which version this event is asking for, and whether it
  # still needs releasing. Keeping it separate means an ordinary merge costs one
  # short job instead of a full cross-compile.
  resolve:
    name: 确定版本
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # The tag reaches the shell through the environment, never through string
      # interpolation into the script body.
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            # Push to main: the top heading in CHANGELOG.md is the version this
            # branch currently claims to be.
            version=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
            if [ -z "$version" ]; then
              echo "::warning::CHANGELOG.md 里没找到 ## [x.y.z] 形式的版本标题，跳过发布"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="v$version"
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号「$tag」不符合 vX.Y.Z 或 vX.Y.Z-rc.1 的格式"
            exit 1
          fi

          # A merge that did not bump the version lands on a tag that already
          # exists; that is the common case and is not an error. An explicit tag
          # push or dispatch is always honoured, so a botched upload can be
          # retried without inventing a new version.
          if [ "$EVENT" = push ] && [ "$REF_TYPE" != tag ] \
             && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag 已经发布过了，跳过"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag with a pre-release suffix (v0.4.0-rc.1) ships as a prerelease.
          if printf '%s' "$tag" | grep -q -- '-'; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "准备发布 $tag (prerelease=$prerelease)"
          {
            echo "release=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  release:
    name: 构建并发布
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # A dispatch runs from a branch, so the tag is checked out explicitly.
      # Everything else releases exactly the commit that triggered it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefix web

      # A commit that cannot pass CI should not become a release.
      - name: 检查代码风格
        run: make lint

      - name: 运行测试
        run: make test

      # `make package` owns the build flags (-trimpath, -s -w, the version
      # ldflag) and the archive layout, so the workflow, the snapshot workflow
      # and a local build stay in sync. It builds the frontend first, so every
      # archive embeds the same UI.
      - name: 交叉编译并打包
        run: make package VERSION=${{ needs.resolve.outputs.tag }}

      # Pulls the section for this version out of CHANGELOG.md. Missing entry is
      # a warning, not a failure — the release still goes out with a stub.
      - name: 生成发布说明
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md 里没有 [$VERSION] 这一节，发布说明将只包含安装指引"
            printf '本次发布没有对应的更新日志条目。\n' > notes.md
          fi

          cat >> notes.md <<EOF

          ## 安装

          下载对应平台的压缩包，解压后直接运行：

          \`\`\`bash
          tar -xzf hypercraft-${VERSION}-linux-amd64.tar.gz
          cd hypercraft-${VERSION}-linux-amd64
          ./hypercraft -data ./data
          \`\`\`

          前端已经嵌在二进制里，不需要另外部署。开机自启参考包内的
          \`hypercraft.service\`。

          ## 校验

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt --ignore-missing
          \`\`\`
          EOF

      # --target makes GitHub create the tag on this commit when it does not
      # exist yet, which is the merge-into-main path; for a tag push the tag is
      # already there and --target is ignored.
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Always stated explicitly, so re-running fixes a release that was
          # marked prerelease by mistake instead of leaving the flag as it was.
          if [ "$PRERELEASE" = true ]; then
            flag=--prerelease
          else
            flag=--prerelease=false
          fi

          # Re-running for an existing release replaces the assets and the notes
          # instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md "$flag"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "$TAG" --notes-file notes.md "$flag" \
              --target "$GITHUB_SHA"
          fi
